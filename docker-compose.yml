services:
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: video-clips-opensearch
    environment:
      - cluster.name=video-clips-cluster
      - node.name=video-clips-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - video-clips-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  jellyfin-capture:
    build:
      context: .
      dockerfile: ./apps/jellyfin-capture-api/Dockerfile
    image: video-clips-jellyfin-capture:latest
    container_name: video-clips-jellyfin-capture
    user: "${JELLYFIN_CAPTURE_UID:-1000}:${JELLYFIN_CAPTURE_GID:-1000}"
    env_file:
      - path: ./.env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4301
      CREDENTIAL_PATH: /run/secrets/google-service-account.json
    volumes:
      - ./apps/jellyfin-capture-api/secrets:/run/secrets:ro
      - type: bind
        source: ${MEDIA_HOST_PATH:-/mnt/nfs}
        target: /mnt/nfs
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${JELLYFIN_CAPTURE_PORT:-4301}:4301"
    networks:
      - video-clips-network
    restart: unless-stopped

volumes:
  opensearch-data:
    driver: local

networks:
  video-clips-network:
    driver: bridge
